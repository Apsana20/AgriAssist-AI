<!DOCTYPE html>
<html>
<head>
<title>Analytics Dashboard</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(to right,#e8f5e9,white);
    text-align:center;
    padding:40px;
}

.container{
    background:white;
    width:70%;
    margin:auto;
    padding:35px;
    border-radius:25px;
    box-shadow:0px 5px 20px rgba(0,0,0,0.1);
}

h1{
    color:#2d6a4f;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#c8e6c9;
    color:#1b5e20;
    padding:15px;
}

td{
    padding:15px;
    border-bottom:1px solid #ddd;
}

button{
    width:250px;
    padding:15px;
    background:linear-gradient(to right,#c8e6c9,white);
    color:#2e7d32;
    border:2px solid #a5d6a7;
    border-radius:25px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
    transition:0.3s;
}

</style>

</head>

<body>

<div class="container">

<h1>📊  AgriAssist Analytics Dashboard</h1>

<br>

<table>

<tr>
<th>Module</th>
<th>Total Predictions</th>
</tr>

<tr>
<td>🌱 Crop Recommendation</td>
<td>25</td>
</tr>

<tr>
<td>🧪 Fertilizer Recommendation</td>
<td>18</td>
</tr>

<tr>
<td>📈 Yield Prediction</td>
<td>20</td>
</tr>

<tr>
<td>🍂 Disease Detection</td>
<td>12</td>
</tr>

<tr>
<td>🤖 AI Chatbot Queries</td>
<td>30</td>
</tr>

</table>

<br><br>

<a href="/dashboard/">
<button>
🏠 Dashboard
</button>
</a>

</div>

</body>
</html>
