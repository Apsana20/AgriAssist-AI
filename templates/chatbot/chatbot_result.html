<!DOCTYPE html>
<html>
<head>
<title>Chatbot Result</title>

<style>

body{
font-family:Arial,sans-serif;
background:linear-gradient(to right,#e8f5e9,white);
text-align:center;
padding:50px;
}

.container{
background:white;
width:55%;
margin:auto;
padding:40px;
border-radius:25px;
box-shadow:0px 5px 20px rgba(0,0,0,0.1);
}

.result{
background:#e8f5e9;
padding:20px;
border-radius:20px;
font-size:25px;
color:#1b5e20;
}

button{
width:250px;
padding:15px;
background:linear-gradient(to right,#c8e6c9,white);
color:#2e7d32;
border:2px solid #a5d6a7;
border-radius:25px;
font-size:18px;
}

</style>

</head>

<body>

<div class="container">

<h1>🤖 AI Response</h1>

<div class="result">

{{ response }}

</div>

<br><br>

<a href="/chatbot/">
<button>🔄 Ask Again</button>
</a>

</div>

</body>
</html>
