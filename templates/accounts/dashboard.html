<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #e8f5e9, white);
            text-align:center;
            margin:0;
            padding:30px;
        }

        .container{
            background:white;
            width:70%;
            margin:auto;
            padding:30px;
            border-radius:25px;
            box-shadow:0px 5px 20px rgba(0,0,0,0.1);
        }

        h1{
            color:#2d6a4f;
            font-size:50px;
        }

        h2{
            color:#4CAF50;
        }

        hr{
            border:1px solid #c8e6c9;
            width:80%;
        }

        button{
            width:320px;
            padding:15px;
            font-size:20px;
            background:linear-gradient(to right,#c8e6c9,white);
            color:#2e7d32;
            border:2px solid #a5d6a7;
            border-radius:25px;
            cursor:pointer;
            font-weight:bold;
            box-shadow:0px 3px 10px rgba(0,0,0,0.1);
        }

        button:hover{
            background:linear-gradient(to right,white,#c8e6c9);
            transform:scale(1.05);
            transition:0.3s;
            box-shadow:0px 5px 15px rgba(0,0,0,0.2);
        }

    </style>

</head>
<body>

<div class="container">

<h1>🌾 AgriAssist AI  Dashboard</h1>

<hr>

<h2>👋 Welcome User</h2>

<br>

<a href="/crop/">
    <button>🌱 Crop Recommendation</button>
</a>

<br><br>

<a href="/disease_detection/">
    <button>🍂 Disease Detection</button>
</a>

<br><br>

<a href="/fertilizer/">
    <button>🧪 Fertilizer Recommendation</button>
</a>

<br><br>

<a href="/yield_prediction/">
    <button>📈 Yield Prediction</button>
</a>

<br><br>

<a href="/chatbot/">
    <button>🤖 AI Chatbot</button>
</a>

<br><br>

<a href="/history/">
    <button>📜 Prediction History</button>
</a>

<br><br>

<a href="/profile/">
    <button>👤 Profile</button>
</a>

<br><br>

<a href="/analytics/">
    <button>📊 Analytics Dashboard</button>
</a>

<br><br>

<a href="/logout/">
    <button>🚪 Logout</button>
</a>

</div>

</body>
</html>
