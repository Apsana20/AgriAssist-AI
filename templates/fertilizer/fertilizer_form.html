<!DOCTYPE html>
<html>
<head>

<title>Fertilizer Recommendation</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(to right,#e8f5e9,white);
    text-align:center;
    padding:40px;
}

.container{
    background:white;
    width:55%;
    margin:auto;
    padding:35px;
    border-radius:25px;
    box-shadow:0px 5px 20px rgba(0,0,0,0.1);
}

h1{
    color:#2d6a4f;
}

input{
    width:80%;
    padding:12px;
    margin:10px;
    border:2px solid #c8e6c9;
    border-radius:15px;
    font-size:16px;
}

button{
    width:250px;
    padding:15px;
    background:linear-gradient(to right,#c8e6c9,white);
    color:#2e7d32;
    border:2px solid #a5d6a7;
    border-radius:25px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
    transition:0.3s;
}

</style>

</head>
<body>

<div class="container">

<h1>🧪 Fertilizer Recommendation System</h1>

<form method="POST">

{% csrf_token %}

<label>Nitrogen (N)</label>
<br>
<input type="number" name="nitrogen" required placeholder="Enter Nitrogen value">

<br><br>

<label>Phosphorus (P)</label>
<br>
<input type="number" name="phosphorus" required placeholder="Enter Phosphorus value">

<br><br>

<label>Potassium (K)</label>
<br>
<input type="number" name="potassium" required placeholder="Enter Potassium value">

<br><br>

<label>Crop Name</label>
<br>
<input type="text" name="crop_name" required placeholder="Enter Crop Name">

<br><br>

<button type="submit">
🧪 Predict Fertilizer
</button>

</form>

</div>

</body>
</html>
