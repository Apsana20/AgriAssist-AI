<!DOCTYPE html>
<html>
<head>
<title>Disease Detection</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(to right,#e8f5e9,white);
    text-align:center;
    padding:40px;
}

.container{
    background:white;
    width:55%;
    margin:auto;
    padding:35px;
    border-radius:25px;
    box-shadow:0px 5px 20px rgba(0,0,0,0.1);
}

h1{
    color:#2d6a4f;
}

input{
    width:80%;
    padding:12px;
    margin:10px;
    border:2px solid #c8e6c9;
    border-radius:15px;
    font-size:16px;
}

button{
    width:250px;
    padding:15px;
    background:linear-gradient(to right,#c8e6c9,white);
    color:#2e7d32;
    border:2px solid #a5d6a7;
    border-radius:25px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
    transition:0.3s;
}

</style>

</head>

<body>

<div class="container">

<h1>🍂 Disease Detection System</h1>

<form method="POST">

{% csrf_token %}

<input type="text"
name="crop_name"
placeholder="Enter Crop Name"
required>

<br><br>

<button type="submit">
🍂 Detect Disease
</button>

</form>

</div>

</body>
</html>
